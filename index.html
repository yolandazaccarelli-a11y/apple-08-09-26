<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!--IMPORTAR O  ESTILO(STYLE.CSS)-->
    <link rel="stylesheet" href="style.css">

<body>
    <!--CABEÇALHO-->
    <header class="cabecalho">
        <nav class="cabecalho-navegacao">
            <i class=" cabecalho-icone fa-brands fa-apple"> </i>
            <a class="cabecalho-link" href="">Loja</a>
            <a class="cabecalho-link" href="">Mac</a>
            <a class="cabecalho-link" href="">iPad</a>
            <a class="cabecalho-link" href="">iPhone</a>

            <a class="cabecalho-link" href="">Entreterimento</a>
            <a class="cabecalho-link" href="">Acessórios</a>
            <a class="cabecalho-link" href="">Suporte</a>

            <i class="cabecalho-icone fa-solid fa-bag-shopping"></i>
        </nav>
        <div class="cabecalho-carrosel">
            <h1 class="card-titulo">

              Muito mais Pro.
            </h2>

                Disponível a partir de 18/09
            </p>

        </div>
        </div>

    <main class="principal">
        <div class="principal-secao iphone-duo">
            <h1 class="card-titulo">
                Iphone Duo
            </h1>
            <h2 class="card-subtitulo">
              Alô. Olá.
            </h2>
            <p class="card-conteudo">
               Pré-venda a partir de 16/10, ás 9h (BRT)
               <br>
               Disponível a partir de 23/10
            </p>
            
            <div class="links">
            <a class="card-link card-link-1"  href="#"> Saiba mais</a>
            <a class="card-link card-link-2"   href=""> Ver preços</a>
        </div>
        </div>

    <footer>

    </footer>
